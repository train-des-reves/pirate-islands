<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Monde déterministe de Pirate Islands : un océan et trois îles procédurales."
    />
    <title>Pirate Islands — Monde déterministe</title>
  </head>
  <body>
    <main id="app" class="scene-shell" data-scene="loading">
      <canvas id="scene-canvas" aria-label="Scène 3D représentant un océan et trois îles"></canvas>
      <div class="halo" aria-hidden="true"></div>
      <section class="interface" aria-labelledby="titre-jeu">
        <p class="eyebrow">Monde ensemencé · Cap 002</p>
        <h1 id="titre-jeu" data-testid="titre-jeu">Pirate Islands</h1>
        <p class="tagline">Trois îles, un océan et une route stable pour chaque expédition.</p>
        <p class="status" data-testid="serveur-status" data-etat="verification">
          <span class="status-dot" aria-hidden="true"></span>
          Vérification du serveur…
        </p>
      </section>
      <p class="coordinates" aria-hidden="true">X · Y · Z &nbsp;|&nbsp; 1280 × 720</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
