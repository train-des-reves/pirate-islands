<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fondation navigateur de Pirate Islands : une mer, un ciel et un serveur joignable."
    />
    <title>Pirate Islands — Fondation</title>
  </head>
  <body>
    <main id="app" class="scene-shell" data-scene="loading">
      <canvas
        id="scene-canvas"
        aria-label="Scène 3D minimale représentant la mer et le ciel"
      ></canvas>
      <div class="halo" aria-hidden="true"></div>
      <section class="interface" aria-labelledby="titre-jeu">
        <p class="eyebrow">Fondation navigateur · Cap 001</p>
        <h1 id="titre-jeu" data-testid="titre-jeu">Pirate Islands</h1>
        <p class="tagline">Une mer à explorer. Un monde prêt à prendre forme.</p>
        <p class="status" data-testid="serveur-status" data-etat="verification">
          <span class="status-dot" aria-hidden="true"></span>
          Vérification du serveur…
        </p>
      </section>
      <p class="coordinates" aria-hidden="true">X · Y · Z &nbsp;|&nbsp; 1280 × 720</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
